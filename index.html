<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cookie Jar - Secure Cloud Sync</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --primary-green: #2ecc71;
            --text-main: #ffffff;
            --text-muted: #888888;
            --border-color: #2d2d2d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; max-width: 480px; margin: 0 auto; padding-bottom: 80px; }
        
        /* Lock Screen Styling */
        #lock-screen {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        .lock-container { text-align: center; max-width: 300px; width: 100%; }
        .lock-title { font-size: 24px; font-weight: 700; margin-bottom: 10px; }
        .lock-subtitle { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        .pin-input {
            width: 100%; padding: 15px; text-align: center;
            background-color: var(--card-bg); border: 2px solid var(--border-color);
            border-radius: 12px; color: white; font-size: 24px; font-weight: bold;
            letter-spacing: 10px; margin-bottom: 15px; outline: none;
        }
        .pin-input:focus { border-color: var(--primary-green); }
        .lock-btn {
            width: 100%; padding: 14px; background-color: var(--primary-green);
            color: var(--bg-color); border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #e74c3c; font-size: 13px; margin-top: 10px; display: none; }

        /* Main App Screen */
        #app-content { display: none; }

        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        header h1 { font-size: 28px; font-weight: 700; }
        .add-goal-btn { background-color: var(--primary-green); color: var(--bg-color); border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 24px; font-weight: bold; cursor: pointer; }
        .overview-card { background-color: var(--card-bg); border-radius: 16px; padding: 20px; margin-bottom: 25px; }
        .overview-main { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px; }
        .total-amount { color: var(--primary-green); font-size: 32px; font-weight: 700; }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
        .stat-item h3 { font-size: 20px; font-weight: 700; }
        .stat-item p { color: var(--text-muted); font-size: 11px; text-transform: uppercase; }
        .goal-card { background-color: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 15px; }
        .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .current-saved { color: var(--primary-green); font-weight: 600; }
        .action-btn { background-color: var(--primary-green); color: var(--bg-color); border: none; width: 32px; height: 32px; border-radius: 50%; font-weight: bold; font-size: 18px; cursor: pointer; }
        .delete-btn { background-color: #e74c3c; color: white; margin-left: 5px; font-size: 14px; }
        .progress-bar-container { width: 100%; background-color: var(--border-color); height: 6px; border-radius: 3px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background-color: var(--primary-green); width: 0%; transition: width 0.3s; }
        .loading-text { text-align: center; color: var(--text-muted); font-size: 14px; padding: 20px; }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="lock-container">
            <div class="lock-title">Cookie Jar Vault</div>
            <div class="lock-subtitle">Enter Passcode to Access Savings</div>
            <input type="password" id="pin-field" class="pin-input" maxlength="4" placeholder="••••" pattern="\d*" inputmode="numeric">
            <button class="lock-btn" onclick="checkPin()">Unlock Vault</button>
            <div id="pin-error" class="error-msg">Incorrect passcode. Try again.</div>
        </div>
    </div>

    <div id="app-content">
        <header>
            <div>
                <h1>Cookie Jar</h1>
                <p style="color: var(--text-muted)">Cloud Saved</p>
            </div>
            <button class="add-goal-btn" onclick="addNewGoal()">+</button>
        </header>

        <div class="overview-card">
            <div class="overview-main">
                <div>
                    <div style="color:var(--text-muted); font-size:13px;">Total Saved</div>
                    <div class="total-amount" id="grand-total">$0.00</div>
                    <div style="color:var(--text-muted); font-size:14px;" id="grand-target">of $0.00</div>
                </div>
                <div style="color:var(--primary-green); font-size:24px; font-weight:bold;" id="global-percentage">0%</div>
            </div>
            <div class="stats-grid">
                <div class="stat-item">
                    <h3 id="stat-goals">0</h3>
                    <p>Goals</p>
                </div>
                <div class="stat-item">
                    <h3 id="stat-completed">0</h3>
                    <p>Done</p>
                </div>
                <div class="stat-item">
                    <h3 id="stat-active">0</h3>
                    <p>Active</p>
                </div>
            </div>
        </div>

        <div style="font-size:18px; font-weight:600; margin-bottom:15px;">Active Goals</div>
        <div id="goal-container">
            <div class="loading-text" id="status-message">Loading data from cloud...</div>
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // CONFIGURATION: Your Live Supabase credentials
        // -------------------------------------------------------------
        const SUPABASE_URL = 'https://txtigddrrvhnfameyxzz.supabase.co'; 
        const SUPABASE_ANON_KEY = 'sb_publishable_yBbohl_Ghkud_zFmLCHHPw_RZqcLf9l';
        // -------------------------------------------------------------

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let goals = [];

        // Hardcoded Pin Check System
        function checkPin() {
            const enteredPin = document.getElementById('pin-field').value;
            const errorElement = document.getElementById('pin-error');
            
            if (enteredPin === "1509") {
                document.getElementById('lock-screen').style.display = 'none';
                document.getElementById('app-content').style.display = 'block';
                fetchGoals(); 
            } else {
                errorElement.style.display = 'block';
                document.getElementById('pin-field').value = '';
            }
        }

        // Allow pressing 'Enter' on keyboard to unlock
        document.getElementById('pin-field').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                checkPin();
            }
        });

        // Fetch data from the Cloud Database
        async function fetchGoals() {
            const { data, error } = await _supabase
                .from('savings_goals')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) {
                console.error(error);
                document.getElementById('status-message').innerText = "Error loading cloud data.";
                return;
            }

            goals = data;
            render();
        }

        // Add a new goal to the Cloud Database
        async function addNewGoal() {
            const name = prompt("Enter Goal Name:");
            if (!name) return;
            const target = parseFloat(prompt("Enter Target Amount ($):"));
            if (!target || target <= 0) return;

            const newGoal = {
                id: Date.now(),
                name: name,
                current: 0,
                target: target
            };

            goals.push(newGoal);
            render();

            const { error } = await _supabase.from('savings_goals').insert([newGoal]);
            if (error) {
                alert("Failed to save to cloud.");
                fetchGoals(); 
            }
        }

        // Add money to a goal in the Cloud Database
        async function addFunds(id) {
            const goal = goals.find(g => g.id === id);
            const val = parseFloat(prompt(`Add funds to ${goal.name}:`));
            if (!val || val <= 0) return;

            const updatedCurrent = Math.min(goal.target, goal.current + val);

            goal.current = updatedCurrent;
            render();

            const { error } = await _supabase
                .from('savings_goals')
                .update({ current: updatedCurrent })
                .eq('id', id);

            if (error) {
                alert("Failed to update cloud data.");
                fetchGoals(); 
            }
        }

        // Delete a goal from the Cloud Database
        async function deleteGoal(id) {
            if (confirm("Delete this goal permanently from the cloud?")) {
                goals = goals.filter(g => g.id !== id);
                render();

                const { error } = await _supabase
                    .from('savings_goals')
                    .delete()
                    .eq('id', id);

                if (error) {
                    alert("Failed to delete.");
                    fetchGoals();
                }
            }
        }

        // Display everything on screen
        function render() {
            const container = document.getElementById('goal-container');
            container.innerHTML = '';

            if (goals.length === 0) {
                container.innerHTML = '<div class="loading-text">No active goals. Tap + to start!</div>';
                return;
            }

            let grandTotal = 0, grandTarget = 0, completed = 0, active = 0;

            goals.forEach(goal => {
                const current = Number(goal.current);
                const target = Number(goal.target);

                grandTotal += current;
                grandTarget += target;
                if (current >= target) completed++; else active++;

                const percent = Math.min(100, Math.round((current / target) * 100)) || 0;

                const card = document.createElement('div');
                card.className = 'goal-card';
                card.innerHTML = `
                    <div class="goal-header">
                        <div>
                            <div style="font-weight:600;">${goal.name}</div>
                            <div style="font-size:13px;">
                                <span class="current-saved">$${current.toFixed(2)}</span>
                                <span style="color:var(--text-muted);"> / $${target.toFixed(2)}</span>
                            </div>
                        </div>
                        <div>
                            <button class="action-btn" onclick="addFunds(${goal.id})">+</button>
                            <button class="action-btn delete-btn" onclick="deleteGoal(${goal.id})">×</button>
                        </div>
                    </div>
                    <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">${percent}% ($${(target - current).toFixed(2)} left)</div>
                    <div class="progress-bar-container"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                `;
                container.appendChild(card);
            });

            document.getElementById('grand-total').innerText = `$${grandTotal.toFixed(2)}`;
            document.getElementById('grand-target').innerText = `of $${grandTarget.toFixed(2)}`;
            document.getElementById('global-percentage').innerText = `${Math.min(100, Math.round((grandTotal / (grandTarget || 1)) * 100)) || 0}%`;
            document.getElementById('stat-goals').innerText = goals.length;
            document.getElementById('stat-completed').innerText = completed;
            document.getElementById('stat-active').innerText = active;
        }
    </script>
</body>
</html>
